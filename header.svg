<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3a6ff"/>
      <stop offset="0.45" stop-color="#ff9bcc"/>
      <stop offset="0.75" stop-color="#ffff80"/>
      <stop offset="1" stop-color="#bfff80"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="28"/></clipPath>
    <g id="m">
      <rect x="-8" y="-34" width="16" height="34" rx="7" fill="#fff4e0"/>
      <path d="M-30 -30 Q-28 -66 0 -68 Q28 -66 30 -30 Q0 -23 -30 -30 Z" fill="currentColor"/>
      <circle cx="-13" cy="-46" r="5" fill="#ffffff"/>
      <circle cx="6" cy="-56" r="4" fill="#ffffff"/>
      <circle cx="16" cy="-39" r="3.5" fill="#ffffff"/>
    </g>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800}
    .s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:600}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .a{animation:up .9s ease-out both}
    .b{animation:up .9s ease-out .3s both}
    @keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
    .st{animation:tw 2.4s ease-in-out infinite;fill:#ffffff;font-family:Arial,sans-serif}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <text class="st" x="120" y="70" font-size="28">✦</text>
    <text class="st" x="330" y="45" font-size="18" style="animation-delay:.6s">✧</text>
    <text class="st" x="860" y="55" font-size="22" style="animation-delay:1.2s">✦</text>
    <text class="st" x="1060" y="85" font-size="18" style="animation-delay:.3s">✧</text>
    <text class="st" x="230" y="185" font-size="16" style="animation-delay:1.6s">✧</text>
    <text class="st" x="960" y="180" font-size="20" style="animation-delay:.9s">✦</text>

    <use xlink:href="#m" href="#m" transform="translate(80 300) scale(1.25)" style="color:#ff6fae"/>
    <use xlink:href="#m" href="#m" transform="translate(140 300) scale(0.8)" style="color:#9d7bff"/>
    <use xlink:href="#m" href="#m" transform="translate(182 300) scale(0.5)" style="color:#ff6fae"/>
    <use xlink:href="#m" href="#m" transform="translate(360 300) scale(0.65)" style="color:#9d7bff"/>
    <use xlink:href="#m" href="#m" transform="translate(400 300) scale(0.42)" style="color:#ffffff"/>
    <use xlink:href="#m" href="#m" transform="translate(800 300) scale(0.45)" style="color:#9d7bff"/>
    <use xlink:href="#m" href="#m" transform="translate(842 300) scale(0.7)" style="color:#ff6fae"/>
    <use xlink:href="#m" href="#m" transform="translate(1015 300) scale(0.55)" style="color:#9d7bff"/>
    <use xlink:href="#m" href="#m" transform="translate(1075 300) scale(1.2)" style="color:#ff6fae"/>
    <use xlink:href="#m" href="#m" transform="translate(1130 300) scale(0.75)" style="color:#9d7bff"/>
  </g>

  <g class="a">
    <text class="t" x="605" y="150" font-size="92" text-anchor="middle" fill="#8a5cd6">Hello Earth!</text>
    <text class="t" x="600" y="145" font-size="92" text-anchor="middle" fill="#e6ffd9">Hello Earth!</text>
  </g>
  <g class="b">
    <text class="s" x="600" y="200" font-size="25" text-anchor="middle" fill="#5b3e96">welcome to my little mossy corner of github</text>
  </g>
</svg>
